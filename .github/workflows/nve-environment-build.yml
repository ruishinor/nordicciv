name: Generate NVE environment maps
on:
  push:
    branches: [feature/nve-environment-maps]
    paths:
      - .github/workflows/nve-environment-build.yml
      - pipeline/sources/nve_environment.py
      - pipeline/build/nve_environment.py
permissions:
  contents: write
  actions: read
jobs:
  generate:
    if: github.ref == 'refs/heads/feature/nve-environment-maps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nve-environment-maps
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: nve-environment-source-and-generated
          run-id: 46093874875
          github-token: ${{ github.token }}
      - name: Remove unused glacier query entries from restored flood manifest
        run: |
          python -c "from pipeline.core import fetch; m=fetch.read_manifest('nve_environment'); m['files']={k:v for k,v in m['files'].items() if k.startswith('flood200/')}; fetch.write_manifest('nve_environment',m)"
      - run: python -m pipeline.build.nve_environment
      - run: python -m unittest discover -s tests -p test_nve_environment.py
      - run: python -m pipeline check --mode built
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nve-environment-source-and-generated
          path: |
            data/raw/nve_environment
            web/data/nve_environment.json
      - name: Checkpoint generated map data only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/nve_environment.json web/data/sources.json
          git diff --cached --quiet || git commit -m "Publish verified NVE southeast flood extent"
          git push origin HEAD:refs/heads/feature/nve-environment-maps
