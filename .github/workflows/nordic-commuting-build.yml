name: Acquire Swedish and Danish commuting
on:
  push:
    branches: [feature/scandinavian-commuting]
    paths:
      - .github/workflows/nordic-commuting-build.yml
      - pipeline/sources/nordic_commuting.py
      - pipeline/build/nordic_commuting.py
permissions:
  contents: write
jobs:
  acquire:
    if: github.ref == 'refs/heads/feature/scandinavian-commuting'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_nordic_commuting.py
      - run: python -m pipeline.build.nordic_commuting --fetch
      - run: python -m pipeline check --mode built
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nordic-commuting-source-and-generated
          path: |
            data/raw/commuting_se
            data/raw/commuting_dk
            web/data/commuting_se.json
            web/data/commuting_dk.json
      - name: Checkpoint generated data
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/commuting_se.json web/data/commuting_dk.json web/data/sources.json
          git diff --cached --quiet || git commit -m "Publish verified Swedish and Danish commuting pairs"
          git push origin HEAD:refs/heads/feature/scandinavian-commuting
