name: Generate CORINE land history
on:
  push:
    branches: [feature/corine-land-history]
    paths:
      - .github/workflows/corine-history-build.yml
      - pipeline/build/land_history.py
      - pipeline/catalogue/corine_history_tiles.json
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/feature/corine-land-history'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/corine-land-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_land_history.py
      - run: python -m pipeline.build.land_history --fetch
      - run: python -m pipeline check --mode built
      - uses: actions/upload-artifact@v4
        with:
          name: corine-generated-data
          path: web/data/lenses.json
      - name: Checkpoint generated data only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/lenses.json
          git diff --cached --quiet || git commit -m "Publish paired CORINE forest and agricultural land changes"
          git push origin HEAD:refs/heads/feature/corine-land-history
