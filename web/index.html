<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Static app: everything is served from this origin; no third-party scripts, fonts, trackers or APIs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NordicCiv — Scandinavia as a strategy game</title>
  <meta name="description" content="Norway, Sweden and Denmark drawn like a 4X strategy map: hex terrain from EU-DEM and CORINE, every municipality as a city with yields from SSB, SCB and Statistics Denmark, resources, wonders and lenses — all from public data.">
  <meta name="theme-color" content="#18292e">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NordicCiv">
  <meta property="og:title" content="Scandinavia as a strategy-game map">
  <meta property="og:description" content="Real geography, municipalities, industries, energy and resources of Norway, Sweden and Denmark, explored like a saved game.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar" inert>
    <div class="brand" title="Scandinavia: Norway, Sweden and Denmark"><img class="brand-emblem" src="logo.svg" alt=""><span class="brand-text">Scandinavia</span></div>
    <div id="yields" class="yields" aria-label="National yields"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="Search municipalities, regions, sites" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="Search municipalities, regions and sites (/ or Ctrl K)">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Share this view" title="Share: copy a link or download an image"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="Keyboard and mouse help" title="Help (?)"></button>
      <button id="btn-pedia" class="btn" aria-label="Open the Almanac" title="What every number means and where it comes from"></button>
    </div>
  </header>

  <canvas id="map" inert role="img" aria-label="Map of Norway, Sweden and Denmark. Use the search box to find a municipality; every statistic shown on the map is also available in the municipality and region panels and in the Council's Explorer table."></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="Details"></aside>
  <button id="btn-inspector" class="panel inspector-restore" type="button" aria-controls="city-panel" aria-expanded="false" hidden></button>

  <div id="lens-area" inert>
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="Choose a lens"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="Lens legend"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="Map lenses">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Resources on tiles (R)" title="Show or hide resources on tiles (R)" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="scalebar" class="scalebar" aria-hidden="true"><i></i><span></span></div>

  <nav id="mobile-nav" class="panel mobile-nav" aria-label="Main" inert>
    <button data-mnav="explore" aria-label="Explore the terrain map"><span aria-hidden="true">🗺️</span>Explore</button>
    <button data-mnav="lenses" aria-label="Choose a statistical lens"><span aria-hidden="true">🔍</span>Lenses</button>
    <button data-mnav="council" aria-label="Open the Council: advisors, compare, explorer, timeline"><span aria-hidden="true">🏛️</span>Council</button>
    <button data-mnav="almanac" aria-label="Open the Almanac: definitions and sources"><span aria-hidden="true">📖</span>Almanac</button>
  </nav>

  <div id="minimap-wrap" class="panel" inert><canvas id="minimap" aria-label="Minimap: click to jump" role="img"></canvas></div>
  <button id="btn-minimap" inert class="panel minimap-toggle" aria-expanded="true" aria-controls="minimap-wrap" aria-label="Hide the minimap"></button>
  <button id="btn-maplayers-mobile" inert class="panel maplayers-mobile" type="button" aria-haspopup="menu" aria-controls="map-layers-pop" aria-expanded="false" aria-label="Map layers" hidden>Layers</button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="Search results" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="Share" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="National report" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="Almanac">
      <button class="close icon-btn" data-close aria-label="Close the Almanac">✕</button>
      <nav id="pedia-nav" aria-label="Almanac pages"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>
